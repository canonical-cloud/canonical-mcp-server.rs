name: web-smoke

# Headless-Chromium smoke test against the LIVE canonical.cloud web surface.
# It hits external sites, so it is NOT a required PR gate: it runs on a daily
# schedule, on push to main, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths:
      - "web-smoke/**"
      - ".github/workflows/web-smoke.yml"

permissions:
  contents: read

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Playwright test runner
        run: npm i -D @playwright/test@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (live canonical.cloud surface)
        run: npx playwright test
