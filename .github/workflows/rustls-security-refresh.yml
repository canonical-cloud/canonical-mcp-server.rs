name: one-shot rustls security refresh

on:
  push:
    branches: [audit/org-policy-pilot-20260915]
    paths:
      - '.github/workflows/rustls-security-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustls-security-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'canonical-cloud/canonical-mcp-server.rs' && github.ref == 'refs/heads/audit/org-policy-pilot-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/org-policy-pilot-20260915
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Resolve patched rustls graph
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 update -p rustls --precise 0.23.45
          git diff --check
          git diff -- Cargo.lock

      - name: Verify the regenerated locked graph
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 test --locked --all-targets
          cargo +1.95.0 clippy --locked --all-targets -- -D warnings

      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # pinned installer action
        with:
          tool: cargo-audit@0.22.2

      - name: Prove the advisory is cleared
        shell: bash
        run: cargo audit --deny warnings

      - name: Commit regenerated lockfile
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- Cargo.lock
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: update rustls to patched 0.23.45'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish verified lockfile
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/audit/org-policy-pilot-20260915
