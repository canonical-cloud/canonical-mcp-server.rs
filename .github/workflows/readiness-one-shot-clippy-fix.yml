name: readiness-one-shot-clippy-fix

on:
  push:
    branches: [feat/read-only-multicloud-readiness]
    paths:
      - .github/workflows/readiness-one-shot-clippy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/read-only-multicloud-readiness
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Apply exact Clippy hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"exact source did not match in {path}; refusing to patch")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/tools/external.rs",
              "    let mut notes = vec![\n",
              "    let notes = vec![\n",
          )
          replace_once(
              "src/tools/observability.rs",
              "    Medium,\n    Low,\n    Info,\n",
              "    Medium,\n",
          )
          replace_once(
              "src/tools/observability.rs",
              "fn add_finding(\n    report: &mut OperationalReport,\n",
              "#[expect(\n    clippy::too_many_arguments,\n    reason = \"private mapper mirrors the stable OperationalFinding fields\"\n)]\nfn add_finding(\n    report: &mut OperationalReport,\n",
          )
          replace_once(
              "src/tools/readiness.rs",
              "fn add_finding(\n    report: &mut ScanReport,\n",
              "#[expect(\n    clippy::too_many_arguments,\n    reason = \"private mapper mirrors the stable Finding fields\"\n)]\nfn add_finding(\n    report: &mut ScanReport,\n",
          )
          replace_once(
              "src/tools/readiness.rs",
              "        assert!(validate_scope(Some(\"$(whoami)\")).is_err());\n",
              "        assert!(validate_scope(Some(\"$(whoami)\")).is_err());\n        assert!(validate_scope(Some(\"-subscription\")).is_err());\n        assert!(validate_scope(Some(\"org/name\")).is_err());\n        assert!(validate_scope(Some(\"org:name\")).is_err());\n",
          )
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check
      - name: Commit Clippy fixes and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/readiness-one-shot-clippy-fix.yml
          git add src/tools/external.rs src/tools/observability.rs src/tools/readiness.rs
          git commit -m "fix: satisfy readiness Rust quality gates"
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/read-only-multicloud-readiness
          rm -f "$askpass"
