name: Oreslang 850 exact Types smoke
on:
  push:
    branches:
      - ci/oreslang850-types-exact-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-types-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated local mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # pinned v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source blob (Oreslang PR850 @ 80dac1f)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object oreslang850/src/dev/oreslang/types/Types.java)" = "fc91c29b7316576dfb036edae12ef907e57897e6"
          java -version
          javac -version
      - name: Compile actual Oreslang Types.java with standalone assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oreslang850-types-classes
          javac --release 21 -d /tmp/oreslang850-types-classes \
            oreslang850/src/dev/oreslang/types/Types.java \
            oreslang850/src/dev/oreslang/types/ExactTypesSmoke.java
      - name: Execute source-verified assignability regressions
        shell: bash
        run: |
          set -euo pipefail
          java -ea -cp /tmp/oreslang850-types-classes dev.oreslang.types.ExactTypesSmoke | tee /tmp/oreslang850-types.out
          grep -F "PASS EXACT-TYPES-SMOKE total=42" /tmp/oreslang850-types.out

  java-compiler-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated compiler source mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup JDK 21 (pinned)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate every pinned Oreslang source blob
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < oreslang850/sources.gitshas
          echo "Exact Oreslang source blobs: verified"
      - name: Compile real parser, TypeChecker and OwnershipChecker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oreslang850-compiler-classes
          find oreslang850/src -name '*.java' -print0 |
            xargs -0 javac --release 21 -d /tmp/oreslang850-compiler-classes
      - name: Run exact-source compiler semantic fixtures
        shell: bash
        run: |
          set -euo pipefail
          java -ea -cp /tmp/oreslang850-compiler-classes dev.oreslang.types.ExactCompilerSmoke |
            tee /tmp/oreslang850-compiler.out
          grep -F "PASS EXACT-COMPILER-SMOKE total=11" /tmp/oreslang850-compiler.out

  java-junit-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Oreslang test mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pinned JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source and JUnit fixtures match Oreslang PR850 blobs
        shell: bash
        run: |
          set -euo pipefail
          for manifest in oreslang850/sources.gitshas oreslang850/tests.gitshas; do
            while read -r expected path; do
              test "$(git hash-object "$path")" = "$expected"
            done < "$manifest"
          done
      - name: Execute original Oreslang parser/type/ownership JUnit regressions
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f oreslang850/pom.xml test

  java-actor-runtime-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout actor runtime mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pinned JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify real actor runtime source and test hashes
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < oreslang850/runtime/sources.gitshas
      - name: Execute real ActorRuntime transport JUnit classes
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f oreslang850/runtime/pom.xml test
      - name: Repeat exact-source actor lifecycle and isolation JUnit five times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            mvn -B -ntp -f oreslang850/runtime/pom.xml test
            echo "PASS current ActorRuntime suite repetition ${attempt}/5"
          done

  java-graalvm25-actor-runtime-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source-verified actor runtime mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pinned GraalVM JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: graalvm
          java-version: '25'
      - name: Verify GraalVM JVM and exact runtime sources
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < oreslang850/runtime/sources.gitshas
      - name: Run original actor transport/isolation JUnit on GraalVM JVM
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f oreslang850/runtime/pom.xml test

  java-graalvm25-actor-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact ActorRuntime source mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pinned GraalVM JDK 25 with Native Image
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: graalvm
          java-version: '25'
      - name: Check exact source blobs and native-image availability
        shell: bash
        run: |
          set -euo pipefail
          java -version
          native-image --version
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < oreslang850/runtime/sources.gitshas
      - name: Compile standalone actor runtime Native Image executable
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f oreslang850/runtime/pom.xml -DskipTests package dependency:build-classpath -Dmdep.outputFile="${PWD}/oreslang850/runtime/target/native-deps.txt"
          CP="oreslang850/runtime/target/classes:$(cat oreslang850/runtime/target/native-deps.txt)"
          native-image --no-fallback -O0 -J-Xmx4g --class-path "$CP" dev.oreslang.runtime.ActorRuntimeNativeSmoke /tmp/oreslang850-actor-native
      - name: Execute native actor isolation smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/oreslang850-actor-native | tee /tmp/oreslang850-actor-native.txt
          grep -Fx "PASS PR850_ACTOR_NATIVE_SMOKE" /tmp/oreslang850-actor-native.txt
