name: Oreslang 850 exact Types smoke
on:
  push:
    branches:
      - ci/oreslang850-types-exact-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-types-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated local mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source blob (Oreslang PR850 @ 80dac1f)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object oreslang850/src/dev/oreslang/types/Types.java)" = "fc91c29b7316576dfb036edae12ef907e57897e6"
          java -version
          javac -version
      - name: Compile actual Oreslang Types.java with standalone assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oreslang850-types-classes
          javac --release 21 -d /tmp/oreslang850-types-classes \
            oreslang850/src/dev/oreslang/types/Types.java \
            oreslang850/src/dev/oreslang/types/ExactTypesSmoke.java
      - name: Execute source-verified assignability regressions
        shell: bash
        run: |
          set -euo pipefail
          java -ea -cp /tmp/oreslang850-types-classes dev.oreslang.types.ExactTypesSmoke | tee /tmp/oreslang850-types.out
          grep -F "PASS EXACT-TYPES-SMOKE total=42" /tmp/oreslang850-types.out
