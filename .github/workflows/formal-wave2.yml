name: Formal wave 2
on:
  pull_request:
    paths:
      - 'conformance/**'
      - '.github/workflows/formal-wave2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python conformance/tool_authority_model.py
