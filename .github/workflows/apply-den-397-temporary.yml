name: Apply DEN-397 flags2env rollout (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-397-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Apply telemetry and documentation changes
        run: python3 scripts/apply_den_397_flags2env.py
      - name: Refresh lockfile and format
        run: |
          cargo update
          cargo fmt --all
      - name: Validate committed candidate
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock README.md src
          git commit -m 'DEN-397: activate hardened flags2env MCP startup'
          git push origin HEAD:feat/den-397-flags2env
