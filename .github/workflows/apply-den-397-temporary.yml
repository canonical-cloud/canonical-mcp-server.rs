name: Apply DEN-397 flags2env rollout (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-397-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Apply telemetry and documentation changes once
        run: |
          if ! grep -q 'filter: EnvFilter' src/telemetry.rs; then
            python3 scripts/apply_den_397_flags2env.py
          fi
      - name: Refresh lockfile and format
        run: |
          cargo update
          cargo fmt --all
      - name: Capture validation diagnostic
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --message-format=short -- -D warnings > .den-397-validation.txt 2>&1
          clippy_status=$?
          cargo test --locked --all-targets >> .den-397-validation.txt 2>&1
          test_status=$?
          cargo build --locked --release >> .den-397-validation.txt 2>&1
          build_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\nbuild_status=%s\n' \
            "$clippy_status" "$test_status" "$build_status" >> .den-397-validation.txt
          exit 0
      - name: Commit implementation and diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock README.md src .den-397-validation.txt
          git commit -m 'DEN-397: activate hardened flags2env MCP startup'
          git push origin HEAD:feat/den-397-flags2env
