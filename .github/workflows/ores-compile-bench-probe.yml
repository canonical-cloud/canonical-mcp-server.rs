name: Isolated Oreslang Compile Benchmark Harness
on:
  push:
    branches: [ci/ores-fast-compile-20261014]
permissions:
  contents: read
jobs:
  benchmark-harness-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Python harness tests (no private repo checkout)
        run: |
          python3 ci-mirror/oreslang-llvm/tests/test_compile_benchmark_harness.py
