[package]
name = "canonical-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "377bff1a4e7424eb98377997a232ddc0fc700f59" }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- functional programming conformance -------------------------------------
# Warn level only: these never fail a build. They fail `cargo clippy -- -D warnings`
# in the nightly job. See FP-GUIDELINES.md for the principle behind each group.

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
