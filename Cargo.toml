[package]
name = "canonical-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
